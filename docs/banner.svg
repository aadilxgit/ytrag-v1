<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="ytrag-v1: PDF RAG pipeline">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f1f1f" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="#0a0a0a"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" fill="none" stroke="#333"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="64" y="64" font-size="14" fill="#777" letter-spacing="3">RETRIEVAL-AUGMENTED GENERATION</text>
    <text x="64" y="144" font-size="76" font-weight="700" fill="#f5f5f5">ytrag-v1</text>
    <text x="64" y="190" font-size="20" fill="#a3a3a3">Ask questions. Get answers from your PDFs.</text>
    <g font-size="15" fill="#d4d4d4">
      <rect x="64" y="216" width="70" height="30" fill="none" stroke="#555"/>
      <text x="99" y="236" text-anchor="middle">PDF</text>
      <text x="147" y="236" fill="#666">→</text>
      <rect x="164" y="216" width="104" height="30" fill="none" stroke="#555"/>
      <text x="216" y="236" text-anchor="middle">chunks</text>
      <text x="281" y="236" fill="#666">→</text>
      <rect x="298" y="216" width="126" height="30" fill="none" stroke="#555"/>
      <text x="361" y="236" text-anchor="middle">embeddings</text>
      <text x="437" y="236" fill="#666">→</text>
      <rect x="454" y="216" width="106" height="30" fill="none" stroke="#555"/>
      <text x="507" y="236" text-anchor="middle">ChromaDB</text>
      <text x="573" y="236" fill="#666">→</text>
      <rect x="590" y="216" width="70" height="30" fill="#f5f5f5" stroke="#f5f5f5"/>
      <text x="625" y="236" text-anchor="middle" fill="#0a0a0a" font-weight="700">LLM</text>
    </g>
  </g>
</svg>
